<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MiniMax Code Browser Bridge — options</title>
    <style>
      body {
        font: 14px/1.5 system-ui, sans-serif;
        margin: 2rem;
        max-width: 40rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
      }
      input {
        width: 100%;
        padding: 0.4rem;
        font-family: ui-monospace, monospace;
      }
      .row {
        margin-top: 0.75rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .value {
        width: auto;
        flex: 1;
        min-width: 0;
        background: #f4f4f5;
      }
      /* The host setting is a long line, and a truncated one cannot be read
         off the screen — so it gets a row of its own. */
      .row.stacked {
        flex-direction: column;
        align-items: stretch;
      }
      .row.stacked .value {
        width: 100%;
      }
      .row.stacked button {
        align-self: flex-start;
      }
      .label {
        margin: 0;
        min-width: 11rem;
        color: #555;
      }
      h2 {
        font-size: 1rem;
        margin-top: 2rem;
      }
      #stored,
      #origin-stored,
      #build-kind,
      #identity-note {
        color: #555;
      }
      #status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Browser Bridge</h1>
    <p>
      This browser connects to a local WebUI. Set that WebUI's address, then
      paste the installation key it shows in its own Settings page.
    </p>
    <h2>This extension</h2>
    <p id="build-kind"></p>
    <div class="row">
      <span class="label">Extension id</span>
      <input id="extension-id" class="value" type="text" readonly spellcheck="false" />
      <button id="copy-extension-id" type="button">Copy</button>
    </div>
    <div class="row stacked">
      <span class="label">Development host setting</span>
      <input id="host-allowlist" class="value" type="text" readonly spellcheck="false" />
      <button id="copy-host-allowlist" type="button">Copy</button>
    </div>
    <p id="identity-note"></p>
    <h2>The WebUI</h2>
    <label for="bridge-origin">WebUI address</label>
    <input
      id="bridge-origin"
      type="text"
      autocomplete="off"
      spellcheck="false"
      placeholder="http://127.0.0.1:8787"
    />
    <div class="row">
      <button id="save-origin" type="button">Save address</button>
    </div>
    <p id="origin-stored"></p>
    <label for="installation-key">Installation key</label>
    <input id="installation-key" type="password" autocomplete="off" spellcheck="false" />
    <div class="row">
      <button id="save" type="button">Save</button>
      <button id="clear" type="button">Clear</button>
    </div>
    <p id="stored"></p>
    <p id="status" role="status"></p>
    <script type="module" src="./src/options.ts"></script>
  </body>
</html>
